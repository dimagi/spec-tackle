{% if viewer %}
<a href="https://github.com/{{ viewer.login }}" target="_blank" rel="noopener"
   class="flex shrink-0 items-center gap-2 rounded-full py-1 pl-1 pr-3 text-xs text-stone-600 hover:bg-stone-200/70 dark:text-stone-300 dark:hover:bg-stone-800"
   title="Signed in to GitHub as {{ viewer.login }}{% if viewer.name %} ({{ viewer.name }}){% endif %}">
  <img src="{{ viewer.avatarUrl }}" alt="" class="h-6 w-6 rounded-full">
  <span class="hidden sm:inline"><span class="text-stone-400">Signed in as</span> <span class="font-semibold">{{ viewer.login }}</span></span>
</a>
{% else %}
<span class="flex shrink-0 items-center gap-2 rounded-full px-3 py-1 text-xs font-medium text-stone-500">
  <span class="h-2 w-2 rounded-full bg-stone-400"></span> Not signed in
</span>
{% endif %}
