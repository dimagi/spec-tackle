<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
  // Theme: "light" (default), "dark" or "system". Applied before first paint to avoid a flash.
  (() => {
    const KEY = "spec-tackle:theme";
    const media = matchMedia("(prefers-color-scheme: dark)");
    const read = () => { try { return localStorage.getItem(KEY) || "light"; } catch { return "light"; } };
    const apply = () => {
      const pref = read();
      const dark = pref === "dark" || (pref === "system" && media.matches);
      const changed = document.documentElement.classList.contains("dark") !== dark;
      document.documentElement.classList.toggle("dark", dark);
      document.querySelectorAll("[data-theme-choice]").forEach((b) => b.classList.toggle("on", b.dataset.themeChoice === pref));
      if (changed) window.dispatchEvent(new Event("spec-tackle:theme"));
    };
    window.setTheme = (pref) => { try { localStorage.setItem(KEY, pref); } catch {} apply(); };
    media.addEventListener("change", apply);
    document.addEventListener("DOMContentLoaded", apply);
    apply();
  })();
</script>
  <title>spec-tackle</title>

</head>

</html>
