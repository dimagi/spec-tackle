[project]
name = "spec-tackle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charl Smit", email = "csmit@dimagi.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
spec-tackle = "spec_tackle:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
